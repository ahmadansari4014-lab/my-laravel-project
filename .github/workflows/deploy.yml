name: Deploy to Hostinger

# Runs on every push to main, or manually from the GitHub "Actions" tab.
# Does nothing (and does not fail) until the Hostinger secrets below are set.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SSH_HOST          Server IP from hPanel -> Advanced -> SSH Access
#   SSH_PORT          SSH port from the same page (Hostinger is usually 65002)
#   SSH_USER          SSH username from the same page
#   SSH_PRIVATE_KEY   Private key whose public key is added in hPanel SSH Access
#   DEPLOY_PATH       Absolute path of the Laravel folder on the server,
#                     e.g. /home/u123456789/domains/clouddextra.com/public_html
# Optional repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   PHP_BIN           PHP 8.4 CLI command on the server (default: php)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
    steps:
      - name: Check deployment secrets
        id: check
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$DEPLOY_PATH" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::notice::Hostinger secrets are not set yet, so nothing was deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Set up SSH key
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-65002}" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Back up .env on the server
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-65002}" "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && test -f .env && cp .env .env.backup-\$(date +%Y%m%d-%H%M%S) || echo 'No .env found - check DEPLOY_PATH'"

      - name: Upload code (keeps .env, storage and vendor on the server)
        if: steps.check.outputs.ready == 'true'
        run: |
          rsync -rlz --checksum \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-65002}" \
            --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='.env' --exclude='.env.*' --exclude='vendor/' \
            --exclude='storage/' --exclude='bootstrap/cache/*.php' \
            --exclude='tests/' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Install dependencies, migrate and clear caches
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-65002}" "$SSH_USER@$SSH_HOST" bash -se <<EOF
          set -e
          cd '$DEPLOY_PATH'
          $PHP_BIN -v | head -1
          composer install --no-dev --optimize-autoloader --no-interaction
          $PHP_BIN artisan migrate --force
          $PHP_BIN artisan optimize:clear
          $PHP_BIN artisan view:cache
          EOF

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
